<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <title>列表面</title>
  </head>
  <body>
    <main id="surface-list" data-surface="surface-list" data-role="other" aria-label="列表面">
      <h1>列表面</h1>
      <nav aria-label="导航树" data-control="nav-tree">
        <a
          href="/compose?target=alpha"
          id="nav-open-target"
          data-action="click"
          data-seed="nav-tree-open-surface"
          data-control="nav-tree-entry"
          data-scope-hint="打开已有目标 Surface"
          aria-label="打开已有目标 Surface"
          >打开目标面</a
        >
        <button
          type="button"
          id="nav-open-create"
          data-action="click"
          data-seed="nav-open-create"
          data-control="nav-create-entry"
          data-scope-hint="打开创建面"
          aria-label="打开创建面"
        >
          打开创建面
        </button>
      </nav>
      <form
        id="create-form"
        hidden
        data-action="submit"
        data-seed="create-item"
        data-scope-hint="提交创建"
      >
        <input
          id="create-name"
          name="name"
          type="text"
          data-action="type"
          data-control="create-name"
          aria-label="名称"
        />
        <button
          type="submit"
          id="control-create-submit"
          data-action="submit"
          data-seed="create-item"
          data-control="control-create-submit"
          data-scope-hint="提交创建"
          aria-label="提交创建"
        >
          提交
        </button>
      </form>
      <ul id="created-nav" aria-label="已创建条目"></ul>
      <ul id="item-list" data-collection="list"></ul>
      <button
        type="button"
        id="control-admin"
        data-action="click"
        data-control="control-admin"
        data-scope-hint="管理后台"
        aria-label="管理后台"
      >
        管理后台
      </button>
      <button
        type="button"
        id="control-thread"
        data-action="click"
        data-control="control-thread"
        data-scope-hint="话题串"
        aria-label="话题串"
      >
        话题串
      </button>
      <div id="gesture-swipe" data-gesture="swipe" data-control="gesture-swipe" aria-label="swipe">
        swipe
      </div>
    </main>
    <script>
      async function loadItems() {
        const res = await fetch("/api/items");
        const items = await res.json();
        const ul = document.getElementById("item-list");
        ul.innerHTML = items
          .map((item) => `<li data-item-id="${item.id}">${item.text}</li>`)
          .join("");
      }
      async function loadCreated() {
        const res = await fetch("/api/created");
        const created = await res.json();
        const ul = document.getElementById("created-nav");
        if (!ul) {
          return;
        }
        ul.innerHTML = created
          .map((item) => `<li data-created-id="${item.id}">${item.name}</li>`)
          .join("");
      }
      document.getElementById("nav-open-create").addEventListener("click", () => {
        const form = document.getElementById("create-form");
        form.hidden = false;
        document.getElementById("create-name").focus();
      });
      document.getElementById("create-form").addEventListener("submit", async (event) => {
        event.preventDefault();
        const raw = document.getElementById("create-name").value;
        const name = String(raw || "").trim() || "created-item";
        await fetch("/create", {
          method: "POST",
          headers: { "content-type": "application/json" },
          body: JSON.stringify({ name })
        });
        document.getElementById("create-name").value = "";
        await loadItems();
        await loadCreated();
      });
      loadItems();
      loadCreated();
    </script>
  </body>
</html>
